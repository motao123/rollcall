# Rollcall —— nginx 反向代理样例
#
# 用途：在宿主上终结 TLS，把请求转发给 127.0.0.1:19080（systemd 或 compose 部署）。
# 与 Caddy 的等价配置见文末注释。
#
# ★ 三个必须项，缺一个就会出问题：
#   1) proxy_buffering off —— 面板用 SSE（/api/events）推送实时数据，
#      开启缓冲会让告警与曲线「攒一波才到」，看起来像卡住。
#   2) proxy_read_timeout 要大于 SSE 心跳间隔（心跳约 25s），
#      留 3600s 是为了容忍反向代理与浏览器之间的空闲。
#   3) 服务端必须带 -trusted-proxies <本机或网段>，
#      否则 Cookie 不带 Secure、审计里的 IP 全是反代地址。
#      宿主直连时用 -trusted-proxies 127.0.0.1/32；compose 时用 172.16.0.0/12。
#
# ★ 不支持子路径部署：前端使用绝对路径（/app.js、/api/...），
#   所以只能挂在域名根，不能放到 https://example.com/monitor/ 下。

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    # 明文一律跳 HTTPS（CSP 与 Cookie Secure 都依赖 HTTPS）
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS 一旦下发就别轻易撤销：浏览器会记住 max-age 内只能走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 静态资源体积小，gzip 收益明显；SSE 响应不会被压缩（本身已禁缓冲）
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;   # 备份导入、主题包上传都很小

    location / {
        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;

        # 保留原始 Host 与协议：面板用它生成接入命令与跳转地址
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Connection        "";

        # ★ SSE 关键：禁用缓冲 + 拉长读超时
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 等价 Caddy 配置（更省事：ACME 自动签发续期）
#
