name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: gofmt
        run: |
          out=$(gofmt -s -l cmd internal)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请运行 make fmt："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross build
        env:
          VERSION: ${{ github.ref_name }}
        run: make linux
