name: CI

on:
  # PR 分支由 pull_request 覆盖；push 只跑 main 与 tag，
  # 否则同仓库 PR 的每次推送会完整跑两遍。
  push:
    branches: [main]
    tags: ["**"]
  pull_request:

# 只在 PR 上取消旧运行：push 到分支（尤其 main）时取消前一次，
# 会让那个提交永远没有 test/race 的成功结果，branch protection 只能看到
# cancelled —— 等于「未测试」（若该检查是必过项，还会挡住合并）。
# push 用 commit SHA 分组：GitHub 即使 cancel-in-progress=false，也会在
# 同组有新任务入队时取消**排队中**的旧任务，快速连续推送仍会漏测中间提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (startsWith(github.ref, 'refs/tags/') && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # 非 tag 构建不要用 ref_name：PR 事件下它是 "123/merge"，
  # 会把这个字符串原样嵌进二进制版本号。
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # tag 名可以合法包含 $ ( ) ` 与 / 等字符。VERSION 最终会进入链接器参数，
      # 先按白名单校验，避免任何形式的命令替换被带进构建；/ 在引用内无害。
      - name: validate version
        run: |
          case "$VERSION" in
            "" | *[!A-Za-z0-9._+/-]*)
              echo "::error::VERSION 含不安全字符，拒绝构建: $VERSION"
              exit 1
              ;;
          esac

      - name: gofmt
        run: |
          # 扫 . 而不是 cmd internal：其它目录新增的 Go 源码也要受同一约束。
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请运行 make fmt："
            echo "$out"
            exit 1
          fi

      # 配色对比度闸门：样式是手写 CSS + 深浅双主题 + 语义色，
      # 曾出过「进度条透明」这类只有肉眼才能发现的事故。
      # 阈值：正文/语义色 ≥4.5（AA），辅助文字与强调色 ≥3（不阻塞，仅提示）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: contrast (WCAG 2.1)
        run: node tools/check-contrast.mjs

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross build
        run: make linux

      # 只编译 Linux 会漏掉 collect_other.go / reexec_other.go 等分支，
      # 用 Windows 目标再走一遍 vet —— 比 go build 多覆盖 _test.go，
      # 避免仅存在于测试文件里的平台相关代码长期失修。
      - name: compile windows target
        run: GOOS=windows GOARCH=amd64 go vet ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # store 的并发快照回归测试在 -race 下会显著变慢（约 2 分钟），
      # 单独成 job，避免拖慢常规 test 反馈。
      - name: go test -race
        run: go test -race ./...

  # 打 tag 时发布预编译产物。仓库此前只有源码：宝塔/1Panel 这类面板用户
  # 机器上没有 Go 工具链，照 README 部署第一步就得先装 Go 1.24+，
  # 这是整个上手流程里最大的断点。
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [test, race]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ★ 版本必须与 test/race 两个 job 完全一致（都钉死在 go.mod 的 1.24.0）。
      # 曾出现 test/race 用 1.24.x、发布用 1.27.3：测试通过的代码由另一个
      # 编译器出产物，等于没验证过发布的那一份。三处修改必须同步。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: build dist
        run: make linux VERSION="$VERSION"

      - name: verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # 16 = server/agent/mcp/rollsign × amd64/arm64/arm/386。
          # rollsign 是签发 Agent 更新清单的工具，少一条校验和就等于
          # 发布包里留了一个没人核对的二进制（Makefile 曾用 rollcall-*
          # 通配，正好把它漏掉）。
          # ★ 这里的计数必须与 Makefile linux 目标的产物清单同步改，
          #   v1.21.0 加 rollcall-mcp 时漏改导致 tag CI 红而 main 绿
          #   （该 job 只在 tag 上跑）。
          test "$(wc -l < SHA256SUMS)" -eq 16

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "构建：Go $(go version | awk '{print $3}')，linux，CGO_ENABLED=0，-trimpath -buildvcs=false"
            echo
            echo "SHA-256："
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > /tmp/rollcall-notes.md
          # ★ 只在 release 不存在时创建并上传：CI 的产物没有发行签名
          #   （.sig 只能在签名机上生成）。如果签名机已上传本地构建
          #   （与 CI 构建字节不同：Go 版本可能不同），这里的 --clobber
          #   会把已签名的二进制覆盖成未签名的，而 .sig 不在 CI 的
          #   dist 里不会被覆盖——结果是 release 上二进制与签名失配，
          #   升级脚本验签必然失败（v1.20.0–v1.20.1 实际踩过）。
          #   正确时序：先推 tag 等 CI 绿，再由签名机上传构建+签名。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release 已存在（签名机上传过），跳过 CI 产物上传"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Rollcall $GITHUB_REF_NAME" \
              --notes-file /tmp/rollcall-notes.md \
              --verify-tag
          fi
