name: CI

on:
  push:
  pull_request:

# 只在 PR 上取消旧运行：push 到分支（尤其 main）时取消前一次，
# 会让那个提交永远没有 test/race 的成功结果，branch protection 只能看到
# cancelled —— 等于「未测试」（若该检查是必过项，还会挡住合并）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # 非 tag 构建不要用 ref_name：PR 事件下它是 "123/merge"，
  # 会把这个字符串原样嵌进二进制版本号。
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      # tag 名可以合法包含 $ ( ) ` 等字符。VERSION 最终会进入链接器参数，
      # 先按白名单校验，避免任何形式的命令替换被带进构建。
      - name: validate version
        run: |
          case "$VERSION" in
            "" | *[!A-Za-z0-9._+-]*)
              echo "::error::VERSION 含不安全字符，拒绝构建: $VERSION"
              exit 1
              ;;
          esac

      - name: gofmt
        run: |
          out=$(gofmt -s -l cmd internal)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请运行 make fmt："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross build
        run: make linux

      # 只编译 Linux 会漏掉 collect_other.go / reexec_other.go 等分支，
      # 用 Windows 目标再走一遍 vet —— 比 go build 多覆盖 _test.go，
      # 避免仅存在于测试文件里的平台相关代码长期失修。
      - name: compile windows target
        run: GOOS=windows GOARCH=amd64 go vet ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      # store 的并发快照回归测试在 -race 下会显著变慢（约 2 分钟），
      # 单独成 job，避免拖慢常规 test 反馈。
      - name: go test -race
        run: go test -race ./...
