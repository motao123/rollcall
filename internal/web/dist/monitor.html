<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollcall 监控面板</title>
<meta name="description" content="服务器监控面板：条形图 / 环形图 / 列表三种视图，含节点详情与历史曲线。">
<!-- 内联 SVG 图标：避免浏览器请求 /favicon.ico 造成 404；
     CSP 的 img-src 允许 data:，所以这种写法在严格策略下也可用。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="monitor.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-dot" id="brandDot"></span>
      Rollcall 监控面板
      <span class="brand-sub hide-sm" id="brandSub">只读聚合视图</span>
    </div>
    <div class="heartbeat" id="heartbeat" aria-live="polite">
      <span class="pulse"></span>
      <span id="hbText">初始化…</span>
    </div>
    <div class="topbar-right">
      <select class="select" id="sourceSel" title="数据来源">
        <option value="mock">数据源：模拟</option>
        <option value="http">数据源：实时接口</option>
      </select>
      <select class="select" id="intervalSel" title="自动刷新间隔">
        <option value="0">不自动刷新</option>
        <option value="10000">每 10 秒</option>
        <option value="30000" selected>每 30 秒</option>
        <option value="60000">每 60 秒</option>
      </select>
      <button class="btn" id="refreshBtn" title="立即刷新（R）">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hide-sm">刷新</span>
      </button>
      <button class="btn icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg class="ico" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <section class="stats" id="stats" aria-label="总体统计"></section>
  <div id="view"></div>
  <details class="notes" id="notes">
    <summary>数据说明：图表内容、字段与刷新机制</summary>
    <div class="notes-body" id="notesBody"></div>
  </details>
</main>

<div class="toast-host" id="toastHost"></div>

<script src="monitor.js" defer></script>
</body>
</html>
