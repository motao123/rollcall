<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rollcall · 服务器监控</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5d8a'/><path d='M8 20l5-7 4 5 3-4 4 6' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="auth-checking">
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15l4-6 3.5 4.5L14 9l7 8"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Rollcall</div>
        <div class="brand-sub">Fleet Monitor</div>
      </div>
    </div>

    <div class="nav-label">监控</div>
    <a class="nav-item" data-route="overview" href="#/overview" aria-label="概览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>概览</span>
    </a>
    <a class="nav-item" data-route="nodes" href="#/nodes" aria-label="节点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      <span>节点</span>
    </a>
    <a class="nav-item" data-route="services" href="#/services" aria-label="服务">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>
      <span>服务</span>
    </a>
    <a class="nav-item" data-route="alerts" href="#/alerts" aria-label="告警">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span>告警</span>
      <span class="nav-count" id="navAlertCount" hidden>0</span>
    </a>

    <div class="nav-label">资产</div>
    <a class="nav-item" data-route="assets" href="#/assets" aria-label="台账">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>
      <span>台账</span>
    </a>

    <div class="nav-label">配置</div>
    <a class="nav-item" data-route="statuspage" href="#/statuspage" aria-label="状态页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>
      <span>状态页</span>
    </a>
    <a class="nav-item" data-route="settings" href="#/settings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007 19.4a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H1a2 2 0 110-4h.1A1.7 1.7 0 002.6 9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H7a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span>设置</span>
    </a>

    <div class="sidebar-foot">
      <button class="icon-btn" id="themeBtn" title="切换主题 (T)" style="width:100%;gap:8px">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <span class="btn-text" style="font-size:12px">深色模式</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">概览</h1>
        <p class="page-sub" id="pageSub">机群健康状态与关键指标</p>
      </div>
      <div class="topbar-right">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索节点 / 服务…" autocomplete="off">
        </div>
        <div class="live" id="liveBadge">
          <span class="live-dot"></span><span id="liveText">实时</span>
        </div>
        <button class="icon-btn" id="refreshBtn" title="刷新 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <div class="user-menu" id="userMenu">
          <button class="user-btn" id="userBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="账号">
            <span class="user-avatar" id="userAvatar">A</span>
            <span class="user-name" id="userName">管理员</span>
            <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="user-pop" id="userPop" role="menu">
            <div class="user-pop-head">
              <div class="user-pop-name" id="userPopName">admin</div>
              <div class="user-pop-mail" id="userPopEmail">未设置邮箱</div>
            </div>
            <a class="user-item" href="/status" target="_blank" rel="noopener" role="menuitem">公开状态页 ↗</a>
            <button class="user-item danger" id="userLogoutBtn" type="button" role="menuitem">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <div class="view" id="view">
      <div class="kpis">
        <div class="kpi"><div class="kpi-label">加载中</div><div class="kpi-value skel" style="height:26px;width:60%"></div></div>
        <div class="kpi"><div class="kpi-label">加载中</div><div class="kpi-value skel" style="height:26px;width:60%"></div></div>
        <div class="kpi"><div class="kpi-label">加载中</div><div class="kpi-value skel" style="height:26px;width:60%"></div></div>
        <div class="kpi"><div class="kpi-label">加载中</div><div class="kpi-value skel" style="height:26px;width:60%"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- 登录层：全屏独立页，避免"侧栏还在、正文一块小卡"的半登录观感。
     由 app.js 在 401 时填充并显示，验证通过后隐藏。 -->
<div id="loginLayer" hidden></div>

<script src="/app.js"></script>
</body>
</html>
